<!DOCTYPE html>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #18253b;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    Arial,
    sans-serif;
}

.page {
  width: min(1500px, 96vw);
  margin: 0 auto;
  padding: 28px 28px 32px;
}

h1 {
  text-align: center;
  margin: 0 0 26px;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1px;
}

.subtitle {
  text-align: center;
  margin: 8px 0 28px;
  color: #718096;
  font-size: 17px;
}

.chart-wrap {
  position: relative;
  width: 100%;
  overflow: visible;
}

svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

/* =========================
   Stage Titles
========================= */

.stage-title {
  font-size: 22px;
  font-weight: 800;
}

.stage-score {
  font-size: 15px;
  font-weight: 500;
}

.axis-label {
  font-size: 19px;
  font-weight: 800;
}

.axis-small {
  font-size: 17px;
  font-weight: 650;
}

/* =========================
   Interactive Points
========================= */

.callout {
  cursor: pointer;
}

.callout-line {
  stroke-width: 2;
  stroke-dasharray: 4 5;
  opacity: .8;
}

.callout-dot {
  fill: #ffffff;
  stroke-width: 4;
  transition: all .15s ease;
}

.callout:hover .callout-dot {
  r: 10;
}

/* =========================
   Tooltip
========================= */

.tooltip {
  position: fixed;
  z-index: 99;

  width: 300px;

  padding: 14px 16px;

  border-radius: 12px;

  background: rgba(20, 20, 20, 0.96);
  color: #ffffff;

  box-shadow:
    0 12px 30px rgba(0, 0, 0, .22);

  pointer-events: none;

  opacity: 0;

  transform: translate(-50%, -115%);

  transition: opacity .12s ease;

  font-size: 14px;
  line-height: 1.65;
}

.tooltip.show {
  opacity: 1;
}

.tooltip strong {
  display: block;

  margin-bottom: 4px;

  font-size: 15px;
  font-weight: 750;

  color: #ffffff;
}

/* =========================
   Footer
========================= */

.footer {
  margin: 22px auto 0;

  width: 94%;
  min-height: 72px;

  border-radius: 28px;

  background: linear-gradient(
    90deg,
    #f0f7ff,
    #f6f7ff
  );

  display: flex;
  align-items: center;

  gap: 18px;

  padding: 14px 28px;
}

.footer-icon {
  width: 48px;
  height: 48px;

  border-radius: 50%;

  background: #e5efff;

  display: grid;
  place-items: center;

  flex: none;
}

.footer-icon svg {
  width: 26px;
  height: 26px;
}

.footer-title {
  font-size: 16px;
  font-weight: 800;
  margin-right: 6px;
}

.footer-text {
  font-size: 15px;
  color: #344054;
  line-height: 1.55;
}

/* =========================
   Responsive
========================= */

@media (max-width: 900px) {

  h1 {
    font-size: 26px;
  }

  }

    font-size: 12px;

  }

  .axis-small {
    font-size: 13px;
  }

  .footer {
    width: 100%;
    border-radius: 18px;
    padding: 12px 16px;
  }

  .footer-text {
    font-size: 12px;
  }

  .tooltip {
    width: 250px;
  }
}

<!-- ==================================================

================================================== -->

<div
  class="tooltip"
  id="tooltip"
>
  <strong id="tooltipTitle"></strong>

  <span id="tooltipText"></span>
</div>


<script>

const tooltip =
  document.getElementById("tooltip");

const titleEl =
  document.getElementById("tooltipTitle");

const textEl =
  document.getElementById("tooltipText");


document
  .querySelectorAll(".callout")
  .forEach(el => {

    el.addEventListener(
      "mouseenter",
      () => {

        titleEl.textContent =
          el.dataset.title;

        textEl.textContent =
          el.dataset.text;

        tooltip.classList.add("show");

      }
    );


    el.addEventListener(
      "mousemove",
      event => {

        tooltip.style.left =
          event.clientX + "px";

        tooltip.style.top =
          event.clientY + "px";

      }
    );


    el.addEventListener(
      "mouseleave",
      () => {

        tooltip.classList.remove("show");

      }
    );

  });

</script>
